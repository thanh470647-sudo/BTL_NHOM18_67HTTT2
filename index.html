
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casio fx-580VN X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <div class="header">
            <div>
                <h2>CASIO</h2>
                <p>fx-580VN X</p>
            </div>
            <span>CLASSWIZ</span>
        </div>

        <div class="screen">
            <div id="history"></div>
            <div id="display">0</div>
        </div>

        <div class="buttons">

            <button class="function">SHIFT</button>
            <button class="function">ALPHA</button>
            <button class="function">MODE</button>
            <button class="function">ON</button>
            <button class="function">Ans</button>

            <button class="function">sin</button>
            <button class="function">cos</button>
            <button class="function">tan</button>
            <button class="function">log</button>
            <button class="function">ln</button>

            <button class="function">√</button>
            <button class="function">x²</button>
            <button class="function">π</button>
            <button class="function">(</button>
            <button class="function">)</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">DEL</button>
            <button class="operator">AC</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">×</button>
            <button class="operator">÷</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <button class="operator">−</button>

            <button>0</button>
            <button>.</button>
            <button>EXP</button>
            <button class="operator">−</button>
            <button class="equal">=</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
